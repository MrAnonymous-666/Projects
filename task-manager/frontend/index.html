<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Task Management System</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28a745">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="storage.js"></script>
<script src="ai-config.js"></script>
<script src="ai-assistant.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f5f5;transition:0.3s;padding:20px;}
.dark{background:#121212;color:white;}
.container{max-width:1000px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 0 15px rgba(0,0,0,0.1);}
.dark .container{background:#1e1e1e;}
h1{text-align:center;margin-bottom:10px;}
.subtitle{text-align:center;color:gray;margin-bottom:20px;}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:15px;}
.row-full{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px;}
.row-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.row-full input,.row-full select,.row-full button{width:100%;}
.row-pair input,.row-pair select,.row-pair button{width:100%;}
input,select,button{padding:10px;border-radius:8px;border:1px solid #ccc;}
button{cursor:pointer;}
.add-btn{background:#28a745;color:white;border:none;}
.dark-btn{background:#333;color:white;border:none;}
.export-btn{background:#007bff;color:white;border:none;}
.stats{display:flex;gap:15px;justify-content:center;margin:15px 0;flex-wrap:wrap;}
.card{background:#eee;padding:10px 20px;border-radius:10px;font-weight:bold;}
.dark .card{background:#333;}
.task{padding:15px;border-radius:10px;background:#f1f1f1;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.dark .task{background:#2b2b2b;}
.high{border-left:8px solid red;}
.medium{border-left:8px solid orange;}
.low{border-left:8px solid green;}
.completed{text-decoration:line-through;opacity:0.6;}
.actions button{margin-left:5px;}
.ai-panel{background:#eef7ee;border:1px solid #cde8cd;border-radius:10px;padding:15px;margin-bottom:15px;}
.dark .ai-panel{background:#1a2e1a;border-color:#2d4d2d;}
.ai-panel h2{font-size:16px;margin-bottom:5px;}
.ai-hint{font-size:12px;color:gray;margin-bottom:8px;}
.ai-response{margin-top:10px;padding:12px;background:white;border-radius:8px;white-space:pre-wrap;font-size:14px;line-height:1.5;}
.dark .ai-response{background:#2b2b2b;}
.suggest-btn{background:#8e44ad;color:white;border:none;white-space:nowrap;}
@media(max-width:700px){
.task{flex-direction:column;align-items:flex-start;}
.actions{width:100%;display:flex;flex-wrap:wrap;gap:5px;}
.actions button{margin-left:0;}
}
</style>
</head>
<body>

<div class="container">

<h1>Smart Task Management System</h1>

<div class="row-full">
<input type="text" id="taskInput" placeholder="Task">
</div>

<div class="row-full">
<input type="date" id="dueDate">
</div>

<div class="row-pair">
<select id="category">
<option>Personal</option>
<option>Study</option>
<option>Work</option>
<option>Health</option>
</select>
<select id="priority">
<option value="high">High</option>
<option value="medium">Medium</option>
<option value="low">Low</option>
</select>
</div>

<div class="row-full">
<button class="add-btn" onclick="addTask()">Add Task</button>
</div>

<div class="row-full">
<button type="button" class="suggest-btn" onclick="handleSuggestCategoryPriority()">✨ Suggest Category/Priority</button>
</div>

<div class="ai-panel">
<h2>✨ AI Assistant</h2>
<p class="ai-hint">Try: "Add task submit report friday high priority" or "What's due this week?"</p>
<div class="row-full">
<input type="text" id="aiInput" placeholder="Ask AI or add a task in plain English...">
</div>
<div class="row-pair">
<button class="add-btn" onclick="handleAIAssistant()">Send</button>
<button class="export-btn" onclick="handleWeeklyInsights()">📊 Weekly AI Insights</button>
</div>
<div id="aiResponseBox" class="ai-response hidden"></div>
</div>

<div class="row-full">
<input type="text" id="search" placeholder="Search Task" onkeyup="renderTasks()">
</div>

<div class="row-pair">
<select id="filterCategory" onchange="renderTasks()">
<option value="All">All Categories</option>
<option value="Personal">Personal</option>
<option value="Study">Study</option>
<option value="Work">Work</option>
<option value="Health">Health</option>
</select>
<select id="sortPriority" onchange="renderTasks()">
<option value="none">Sort Priority</option>
<option value="high">High First</option>
<option value="low">Low First</option>
</select>
</div>

<div class="row-pair">
<button class="dark-btn" onclick="toggleDark()">Dark Mode</button>
<button class="export-btn" onclick="exportPDF()">Export PDF</button>
</div>

<div class="stats">
<div class="card">Total Tasks: <span id="totalCount">0</span></div>
<div class="card">Completed: <span id="completedCount">0</span></div>
<div class="card">Pending: <span id="pendingCount">0</span></div>
</div>

<div id="taskList"></div>

</div>

<script>

let tasks = [];
const TASKS_KEY = "tasks";
const DARK_MODE_KEY = "darkMode";

// ===== LOAD / SAVE (device storage, not a server) =====

async function loadTasks(){
  const stored = await deviceStorage.get(TASKS_KEY);
  tasks = stored ? JSON.parse(stored) : [];
  renderTasks();
}

async function saveTasks(){
  await deviceStorage.set(TASKS_KEY, JSON.stringify(tasks));
}

async function addTask(){
  let text = document.getElementById("taskInput").value;
  let category = document.getElementById("category").value;
  let priority = document.getElementById("priority").value;
  let dueDate = document.getElementById("dueDate").value;

  if(text.trim() === ""){
    alert("Enter task");
    return;
  }

  tasks.push({
    id: Date.now().toString(),
    text,
    category,
    priority,
    dueDate,
    completed: false
  });

  await saveTasks();
  document.getElementById("taskInput").value = "";
  renderTasks();
}

async function deleteTask(id){
  tasks = tasks.filter(t => t.id !== id);
  await saveTasks();
  renderTasks();
}

async function toggleComplete(id){
  const task = tasks.find(t => t.id === id);
  if(task) task.completed = !task.completed;
  await saveTasks();
  renderTasks();
}

async function editTask(id){
  const task = tasks.find(t => t.id === id);
  if(!task) return;

  let newText = prompt("Edit Task", task.text);
  if(newText){
    task.text = newText;
    await saveTasks();
    renderTasks();
  }
}

function renderTasks(){
  let list = document.getElementById("taskList");
  list.innerHTML = "";

  let search = document.getElementById("search").value.toLowerCase();
  let category = document.getElementById("filterCategory").value;
  let sort = document.getElementById("sortPriority").value;

  let filtered = tasks.filter(task => {
    let matchSearch = task.text.toLowerCase().includes(search);
    let matchCategory = category === "All" || task.category === category;
    return matchSearch && matchCategory;
  });

  const rank = { high: 3, medium: 2, low: 1 };
  if(sort === "high") filtered.sort((a,b) => rank[b.priority] - rank[a.priority]);
  if(sort === "low") filtered.sort((a,b) => rank[a.priority] - rank[b.priority]);

  filtered.forEach(task => {
    let div = document.createElement("div");
    div.className = `task ${task.priority}`;
    div.innerHTML = `
      <div>
        <h3 class="${task.completed ? 'completed' : ''}">${task.text}</h3>
        <p>Category: ${task.category}</p>
        <p>Priority: ${task.priority}</p>
        <p>Due: ${task.dueDate || "Not Set"}</p>
      </div>
      <div class="actions">
        <button onclick="toggleComplete('${task.id}')">✓</button>
        <button onclick="editTask('${task.id}')">Edit</button>
        <button onclick="deleteTask('${task.id}')">Delete</button>
      </div>
    `;
    list.appendChild(div);
  });

  updateStats();
}

function updateStats(){
  document.getElementById("totalCount").innerText = tasks.length;
  let completed = tasks.filter(t => t.completed).length;
  document.getElementById("completedCount").innerText = completed;
  document.getElementById("pendingCount").innerText = tasks.length - completed;
}

// ===== AI FEATURES =====

function aiKeyIsMissing(){
  return !AI_CONFIG.PROXY_URL;
}

function showAIBox(text){
  const box = document.getElementById("aiResponseBox");
  box.classList.remove("hidden");
  box.innerText = text;
}

// Natural language add / chat Q&A (combined)
async function handleAIAssistant(){
  const input = document.getElementById("aiInput");
  const text = input.value.trim();
  if(!text) return;

  if(aiKeyIsMissing()){
    showAIBox("AI isn't set up yet. Add your free Gemini API key in frontend/ai-config.js (see README.md).");
    return;
  }

  showAIBox("Thinking...");

  try{
    const result = await aiProcessAssistantMessage(text, tasks);

    if(result.action === "add_tasks" && Array.isArray(result.tasks)){
      for(const t of result.tasks){
        tasks.push({
          id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
          text: t.text,
          category: t.category || "Personal",
          priority: t.priority || "medium",
          dueDate: t.dueDate || "",
          completed: false
        });
      }
      await saveTasks();
      renderTasks();
      showAIBox(`Added ${result.tasks.length} task(s): ` + result.tasks.map(t => t.text).join(", "));
    } else {
      showAIBox(result.message || "(no response)");
    }
  }catch(err){
    showAIBox("AI error: " + err.message);
  }

  input.value = "";
}

// Smart category/priority suggestion for the manual add form
async function handleSuggestCategoryPriority(){
  const text = document.getElementById("taskInput").value.trim();
  if(!text){
    alert("Type a task first, then click Suggest");
    return;
  }
  if(aiKeyIsMissing()){
    alert("AI isn't set up yet. Add your free Gemini API key in frontend/ai-config.js (see README.md).");
    return;
  }

  try{
    const result = await aiSuggestCategoryPriority(text);
    if(result.category) document.getElementById("category").value = result.category;
    if(result.priority) document.getElementById("priority").value = result.priority;
  }catch(err){
    alert("AI error: " + err.message);
  }
}

// Weekly AI insights/summary
async function handleWeeklyInsights(){
  if(aiKeyIsMissing()){
    showAIBox("AI isn't set up yet. Add your free Gemini API key in frontend/ai-config.js (see README.md).");
    return;
  }

  showAIBox("Generating insights...");

  try{
    const summary = await aiGenerateWeeklySummary(tasks);
    showAIBox(summary);
  }catch(err){
    showAIBox("AI error: " + err.message);
  }
}

async function toggleDark(){
  document.body.classList.toggle("dark");
  await deviceStorage.set(DARK_MODE_KEY, document.body.classList.contains("dark") ? "true" : "false");
}

function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("Task Report", 10, 10);
  let y = 20;
  tasks.forEach((task, i) => {
    doc.text(`${i+1}. ${task.text} | ${task.category} | ${task.priority} | ${task.dueDate || ""}`, 10, y);
    y += 10;
  });
  doc.save("Tasks.pdf");
}

// ===== INIT =====
async function init(){
  const darkPref = await deviceStorage.get(DARK_MODE_KEY);
  if(darkPref === "true") document.body.classList.add("dark");

  await loadTasks();

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  }
}

init();

</script>

</body>
</html>
